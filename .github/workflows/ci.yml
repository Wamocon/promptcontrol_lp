name: CI – Validate Landing Page

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run HTML lint
        run: npx htmlhint *.html --config .htmlhintrc || true

      - name: Run validation checks
        run: node tests/validate.js